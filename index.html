function renderQuiz(){const q=QUESTIONS[state.cursor],a=state.answers[state.cursor],count=state.answers.filter(v=>v!==null).length;const encourage=state.cursor<8?'先把现实条件说清楚，合适的开始才会更轻松。':state.cursor<15?'不用选完美答案，选更像平时的你就好。':state.cursor<24?'已经过半啦，钱多多正在认真寻找你的能力组合。':'最后几步！一份可解释的探索报告正在等你。';return `<section class="page quiz-wrap"><div class="quiz-top"><span>你的天赋探索 · ${state.cursor+1} / 30</span><button class="btn text small" data-action="pause">暂停并保存</button></div><div class="progress" role="progressbar" aria-label="已回答题数" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="30"><span style="width:${count/30*100}%"></span></div><div class="panel quiz-card"><div class="question-meta">QUESTION ${String(state.cursor+1).padStart(2,'0')} <span>· ${q.type==='resource'?'现实条件':q.type==='scale'?'行为量表':q.type==='behavior'?'行为偏好':'情景选择'}</span></div><h1 id="question-title">${esc(q.text)}</h1><fieldset style="border:0;padding:0;margin:0" aria-labelledby="question-title"><legend class="screen-reader">选择一个最符合你的答案</legend><div class="options">${q.options.map((o,i)=>`<label class="option ${a===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${a===i?'checked':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(o.label)}</span></label>`).join('')}</div></fieldset><div class="quiz-controls"><button class="btn" data-action="prev" ${state.cursor===0?'disabled':''}>← 上一题</button><span class="key-hint">方向键选择 · Enter 下一题</span><button class="btn primary" data-action="next" ${a===null?'disabled':''}>${state.cursor===29?'生成我的报告 ✦':'下一题 →'}</button></div></div><div class="encouragement">${mascot(state.cursor<15?0:1,'#9d8be2',state.cursor>=15?'analyze':'happy')}<div>${encourage}<div class="tiny">每次选择都会自动保存到当前浏览器。</div></div></div></section>`;}
function renderCatalog(){return `<section class="page"><div class="page-top"><div><div class="eyebrow">SIDE QUEST ATLAS</div><h1 class="page-title">副业探索图鉴 <span style="color:var(--purple);font-size:16px">/ 100</span></h1><p class="subtitle">从一个具体问题出发，找到值得试做的小方向。</p></div><button class="btn small" data-action="start">找到适合我的方向 ↗</button></div><div class="toolbar"><label class="screen-reader" for="search">搜索副业或交付内容</label><input id="search" class="field search" type="search" placeholder="⌕  搜索副业名称、技能或交付内容…" value="${esc(filters.query)}"><select class="field" id="filter-time" aria-label="筛选每周时间"><option value="all">所有时间</option>${[2,4,8,12].map(v=>`<option value="${v}" ${filters.time===String(v)?'selected':''}>每周 ≤ ${v}小时</option>`).join('')}</select><select class="field" id="filter-budget" aria-label="筛选启动预算"><option value="all">所有预算</option>${[0,300,1000].map(v=>`<option value="${v}" ${filters.budget===String(v)?'selected':''}>最低成本 ≤ ${v}元</option>`).join('')}</select><select class="field" id="filter-difficulty" aria-label="筛选学习难度"><option value="all">所有难度</option>${[2,3,4].map(v=>`<option value="${v}" ${filters.difficulty===String(v)?'selected':''}>难度 ≤ ${v}/5</option>`).join('')}</select><label class="check-inline"><input id="filter-fav" type="checkbox" ${filters.favorites?'checked':''}>只看收藏</label></div><div class="chips"><button class="chip ${filters.category==='all'?'active':''}" data-action="filter-category" data-id="all">全部方向</button>${CATEGORIES.map(c=>`<button class="chip ${filters.category===c.id?'active':''}" data-action="filter-category" data-id="${c.id}">${c.icon} ${c.name}</button>`).join('')}</div><p id="catalog-count" class="tiny muted" style="margin-bottom:15px"></p><div class="catalog-grid" id="catalog-grid"></div><div id="compare-tray"></div><p class="sources notice">时间、预算为小规模试做估计，假设已有设备与网络。方向不代表已经验证的市场需求，请先制作样品并询问真实用户。</p></section>`;}
function renderCatalogCards(){const query=filters.query.trim().toLowerCase();const list=DIRECTIONS.filter(d=>(filters.category==='all'||d.category===filters.category)&&(!query||[d.name,d.deliverable,d.skills.join(' ')].join(' ').toLowerCase().includes(query))&&(filters.time==='all'||d.hours<=+filters.time)&&(filters.budget==='all'||d.budget[0]<=+filters.budget)&&(filters.difficulty==='all'||d.difficulty<=+filters.difficulty)&&(!filters.favorites||state.favorites.includes(d.id)));$('#catalog-count').textContent=`找到 ${list.length} 个方向 · 每一条都附交付范围与启动约束`;$('#catalog-grid').innerHTML=list.length?list.map(d=>`<article class="direction-card"><div class="card-head"><div class="category-icon">${category(d.category).icon}</div><button class="fav ${state.favorites.includes(d.id)?'on':''}" data-action="favorite" data-id="${d.id}" aria-label="${state.favorites.includes(d.id)?'取消收藏':'收藏'}${esc(d.name)}" aria-pressed="${state.favorites.includes(d.id)}">${state.favorites.includes(d.id)?'★':'☆'}</button></div><div><span class="tiny muted">${category(d.category).name} · ${d.id}</span><h3>${d.name}</h3></div><p class="body">${d.deliverable}</p><div class="meta-row"><span>◷ ${d.hours}小时 / 周</span><span>¥ ${d.budget[0]}–${d.budget[1]}</span><span>难度 ${d.difficulty}/5</span></div><div class="card-bottom"><button class="btn text" data-action="detail" data-id="${d.id}">了解这个方向 ↗</button><label class="check-inline"><input type="checkbox" data-compare="${d.id}" ${compareIds.includes(d.id)?'checked':''}>加入PK</label></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1"><h2>暂时没有符合筛选的方向</h2><p>试试放宽一个条件，或清除筛选重新探索。</p><button class="btn" data-action="reset-filters">清除筛选</button></div>';renderCompareTray();}
function renderCompareTray(){const el=$('#compare-tray');if(el)el.innerHTML=compareIds.length?`<div class="compare-tray"><span>已选 ${compareIds.length}/2：${compareIds.map(id=>esc(DIRECTIONS.find(d=>d.id===id).name)).join(' · ')}</span><div><button class="btn text small" data-action="clear-pk">重选</button><button class="btn primary small" data-action="compare" ${compareIds.length===2?'':'disabled'}>开始PK ↗</button></div></div>`:'';}
function breakdown(r){return `<div class="match-breakdown"><div>能力适合度 · 40%<strong>${r.parts.ability}</strong></div><div>资源条件 · 25%<strong>${r.parts.resource}</strong></div><div>兴趣与方式 · 20%<strong>${r.parts.work}</strong></div><div>风险与时间 · 15%<strong>${r.parts.riskTime}</strong></div></div>`;}
function recCard(r,i){const d=r.direction;return `<article class="${i===0?'recommendation featured':'panel recommendation'}"><div class="rec-top"><div><span class="ranking">${i===0?'✦ 核心推荐 · TOP 01':`TOP ${String(i+1).padStart(2,'0')} · ${category(d.category).name}`}</span><h3>${d.name}</h3></div><div class="match-score">${r.score}<small>匹配指数 / 100</small></div></div><p class="rec-text">${d.deliverable}</p><div class="meta-row"><span>◷ 每周 ${d.hours}小时</span><span>¥ ${d.budget[0]}–${d.budget[1]}元</span><span>${d.needsFace?'需露脸演示':'可不露脸'}</span></div>${i===0?breakdown(r):''}<p class="rec-text"><strong style="color:var(--ink)">为什么推荐你：</strong>${esc(r.reason)}</p>${i===0||state.demo?`<details ${i===0?'open':''}><summary>完整匹配解释与挑战</summary>${i===0?'':breakdown(r)}<p><strong>工具：</strong>${esc(d.tools.join('、'))}</p><p><strong>获客：</strong>${esc(d.channels)}</p><p><strong>挑战：</strong>${esc(r.challenges.join('；'))}</p><p>综合分 = 未取整的能力分 × 0.40 + 资源分 × 0.25 + 兴趣方式分 × 0.20 + 风险时间分 × 0.15，最后取整。各部分显示值已取整，可能有1分差异。</p></details>`:''}<div style="display:flex;gap:12px;margin-top:14px"><button class="btn text small" data-action="detail" data-id="${d.id}">查看方向详情 ↗</button><button class="btn text small" data-action="favorite" data-id="${d.id}">${state.favorites.includes(d.id)?'★ 已收藏':'☆ 收藏方向'}</button></div></article>`;}
function upgradePanel(){return `<div class="upgrade no-print"><span class="pill">DEEP EXPLORATION · 深度体验</span><h2 style="margin-top:13px">给你的下一步，多一点具体的支持</h2><p>TOP10匹配、完整30天计划、项目PK、可编辑清单和PDF / Markdown / JSON导出。当前单文件版本开放免费演示，无需付款；演示开关只存在本机。</p><button class="btn primary" data-action="demo">开启深度报告演示 ↗</button><button class="btn text small" data-action="commerce" style="margin-left:15px">了解商业接入</button></div>`;}
function pitfalls(p){const c=p.conditions;return [c.budget<=300?'预算有限：先用已有设备做样品，不在需求验证前购买昂贵课程或订阅。':'为课程、订阅与广告设置总试错上限，先核算真实使用需求。',c.time<=4?'时间较少：把服务切成单次小交付，避免承诺持续代运营或随时响应。':'记录沟通、返工和维护耗时，不能只计算制作时间。',c.ai<=1?'工具基础仍在积累：先做演示并人工核查，不把AI原稿直接交付。':'工具跑通不等于质量可靠：保留人工核查、备份和失败处理。','只使用自有或授权素材；客户数据先脱敏，使用外部AI前取得明确同意。',c.occupation==='employed'?'查看适用的劳动合同、公司制度与保密要求，避免使用公司资源或客户信息。':'确认作品版权、平台规则与适用的经营要求，不把点赞当作付费需求。'];}
function renderReport(){const h=getActive(),r=activeResult();if(!h||!r)return emptyPage('你还没有完成测评','回答30道题，生成属于你的探索报告。');const p=r.profile,persona=r.personality,eligible=topEligible(r),top=eligible.slice(0,state.demo?10:3),ordered=p.scores.map((s,i)=>({s,i})).filter(x=>x.i!==7).sort((a,b)=>b.s-a.s||a.i-b.i),strengths=ordered.slice(0,3),growth=[...ordered].reverse().slice(0,2),quick=eligible.find(x=>x.direction.id!==top[0]?.direction.id&&x.direction.hours<=3&&x.direction.difficulty<=3),long=eligible.find(x=>x.direction.id!==top[0]?.direction.id&&['C','E','G'].includes(x.direction.category)),blocked=r.ranked.filter(x=>!x.eligible).slice(0,2);const combo=combinationFor(p,eligible);
 return `<section class="page"><div class="page-top no-print"><div class="eyebrow">YOUR PERSONAL FIELD NOTES</div><div><span class="pill">${sampleMode?'报告样例 · 非本人结果':state.demo?'深度报告 · 本地演示':'免费探索报告'}</span><button class="btn text small" data-action="history">所有报告 →</button></div></div><div class="report-hero"><div><span class="pill" style="background:#ffffff80">${persona.emoji} 你的AI副业人格${sampleMode?' · 样例':''}</span><h1>${persona.name}</h1><p class="description">${persona.description} ${persona.easter}</p><div style="margin-top:18px">${strengths.map(x=>`<span class="badge">${DIMENSIONS[x.i].short}</span>`).join(' ')}</div><p class="tiny" style="color:#93859f;margin-top:15px">${dateLabel(h.created)} · 模型 v1 · 自我报告画像</p></div>${mascot(persona.index,persona.color,'celebrate')}</div><div class="report-actions no-print"><button class="btn primary small" data-action="poster">↓ 下载人格海报 PNG</button><button class="btn small" data-action="pdf">↓ 报告 PDF</button><button class="btn small" data-action="json">↓ 结果 JSON</button><button class="btn small" data-action="friend">♡ 好友互补</button><button class="btn small" data-action="retest">↻ 重新测试</button>${state.demo?'<button class="btn text small" data-action="demo-off">切换免费体验</button>':''}</div><div class="report-grid"><div class="panel"><div class="eyebrow">YOUR ABILITY MAP</div><h2 style="margin-top:9px">八维能力，拼成独一份的你</h2>${radar(p.scores)}<div class="score-list">${DIMENSIONS.map((d,i)=>`<div class="score-item" title="${esc(d.explain)}"><span>${d.name}</span><strong>${p.scores[i]}</strong></div>`).join('')}</div><p class="tiny muted" style="margin-top:15px">风险分表示试错接受程度，高低不代表能力优劣。分数来自题目自评，没有人群排名。</p><details style="margin-top:14px"><summary>分数如何计算？</summary><p>每道行为题对相关维度提供0—4分证据，汇总后除以该维度所有相关题的理论最高分，再乘100。第18题与第24题反向计分。未选择的相关行为计0；资源题只用于条件匹配，不参与能力分。</p>${DIMENSIONS.map(d=>`<p><strong>${d.name}：</strong>${d.explain}</p>`).join('')}</details></div><div class="panel"><div class="eyebrow">A FEW THINGS ABOUT YOU</div><h2 style="margin-top:9px">让优势有用，让成长有方向</h2><div class="insight-block"><h3>✦ 三项突出优势</h3>${strengths.map(x=>`<p><strong>${DIMENSIONS[x.i].name} ${x.s}分</strong> · ${DIMENSIONS[x.i].explain}</p>`).join('')}</div><div class="insight-block"><h3>↗ 两个可以练习的方向</h3>${growth.map(x=>`<p><strong>${DIMENSIONS[x.i].short}</strong> · ${['每周把一个想法写成100字说明。','选择一个工具跑通最小例子并记录错误。','给每条结论保留原始来源和反例。','用一次自愿访谈练习问清具体需求。','每天留一小段固定时间并记录完成情况。','把亲自掌握的知识写成一页新手说明。','为一个合作任务写清分工和截止时间。'][x.i]}</p>`).join('')}</div><div class="insight-block"><h3>人格优势与盲区</h3><p>${persona.strength}；留意：${persona.blind}。</p><p>${persona.growth}</p></div><div class="insight-block"><h3>你的现实条件</h3><p>每周 ${p.conditions.time}小时 · 预算上限 ${p.conditions.budget}元 · ${p.conditions.face?'可露脸':'不露脸'} · AI熟练度 ${p.conditions.ai}/3</p><p>条件可以在下方模拟器调整，看看新的可能。</p></div></div></div><h2 class="section-heading">与你更合拍的副业 <span class="badge">TOP ${top.length}</span></h2><p class="subtitle" style="margin-bottom:18px">先满足硬性条件，再比较能力40% + 资源25% + 兴趣与方式20% + 风险与时间15%。这不是赚钱成功概率。</p>${top.length?recCard(top[0],0):'<div class="notice">当前条件下没有可优先尝试的方向。可先练习工具或在模拟器调整投入。</div>'}<div class="rec-grid">${top.slice(1).map((x,i)=>recCard(x,i+1)).join('')}</div><div class="combinations" style="margin-top:18px">${quick?`<div class="panel"><span class="badge">可快速试错</span><h3 style="margin-top:12px">${quick.direction.name}</h3><p>每周${quick.direction.hours}小时的最小版本，适合先拿一个样品验证。第一步：${quick.direction.first}。</p><button class="btn text small no-print" data-action="detail" data-id="${quick.direction.id}">查看详情 →</button></div>`:''}${long?`<div class="panel"><span class="badge">适合长期积累</span><h3 style="margin-top:12px">${long.direction.name}</h3><p>把每次试做沉淀成可复用资料或资产，持续核查和维护；当前匹配指数 ${long.score}。</p><button class="btn text small no-print" data-action="detail" data-id="${long.direction.id}">查看详情 →</button></div>`:''}</div><h2 class="section-heading">你的隐藏能力组合</h2><div class="panel"><h3 style="font-size:17px">${combo.map(x=>x.direction.name).join(' + ')}</h3><p class="rec-text">${combo.map(x=>`「${x  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG文件生成失败。')),'image/png'));downloadBlob(blob,`AI副业人格-${r.personality.name}.png`);toast('1080 × 1920人格海报已发起下载。');return blob;
}
function exportJSON(){const h=getActive(),r=activeResult(),ctx=planContext();if(!h||!r)throw new Error('请先完成测评。');const payload={product:CONFIG.name,modelVersion:1,exportedAt:new Date().toISOString(),sample:sampleMode,record:h,profile:r.profile,personality:r.personality.id,recommendations:r.ranked.map(x=>({id:x.direction.id,name:x.direction.name,score:x.score,parts:x.parts,eligible:x.eligible,blocked:x.blocked})),plan:ctx?.plan,completed:ctx?state.plans[ctx.key]||[]:[],notes:ctx?Object.fromEntries(Object.entries(state.edits).filter(([k])=>k.startsWith(ctx.key+':'))):{}};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}),'AI副业探索结果.json');toast('结果JSON已发起下载，文件包含你的回答与条件，请妥善保管。');}
function about(){openModal(`<span class="pill">ABOUT THE LAB</span><h2>从能力匹配，到真实需求验证</h2><p class="rec-text">本产品包含30道原创题、八个维度、12种人格和100个具体副业方向。题目采用情景、行为、资源与五档量表形式；没有随机抽签。</p><p class="rec-text">人格由八维分数与12套固定权重决定。副业先检查每周时间、最低预算、露脸和社群条件，再计算综合匹配；工具基础不足或沟通偏好不符会降低资源分。</p><p class="rec-text">这是探索用规则模型，尚未做心理测量效度验证。推荐是小规模试做假设，不是经证实的市场机会，也不预测收入。</p><p class="rec-text">核心功能完全离线，不调用外部AI，不上传答案。以下工具是可选制作工具示例，需自行核查账号、地区可用性、许可、费用和数据条款。</p><div class="sources"><a href="https://help.openai.com/en/articles/11084440-images-in-chatgpt" target="_blank" rel="noopener">图像AI参考：ChatGPT官方说明</a><a href="https://docs.n8n.io/" target="_blank" rel="noopener">流程工具参考：n8n官方文档</a><a href="https://www.notion.com/help/start-with-a-template" target="_blank" rel="noopener">模板参考：Notion官方说明</a><p>工具能力参考核验：2026年10月14日。数据库中的时间和成本为规划估计，未经市场验证。</p></div><button class="btn primary small" data-action="start" style="margin-top:20px">开始一次探索 ↗</button>`);}
function clearAll(){openModal(`<h2>清空这份浏览器里的所有记录？</h2><p class="subtitle" style="margin:14px 0 22px">将删除答案、报告历史、收藏、计划勾选、备注与演示权限。删除后无法通过本产品恢复。已下载文件需要你自行管理。</p><button class="btn danger" data-action="confirm-clear">确认清空全部本地数据</button><button class="btn text" data-action="close">保留记录</button>`);}
function copyText(value){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(value).then(()=>toast('结果码已复制。')).catch(()=>toast('浏览器不允许自动复制，请选中结果码手动复制。'));}else{const field=$('#my-code');field?.focus();field?.select();toast('结果码已选中，请手动复制。');}}
async function handleAction(action,id){
 switch(action){
 case 'home':case 'catalog':case 'history':navigate(action);break;
 case 'report':sampleMode=sampleMode&&!state.history.length;navigate('report');break;
 case 'plan':navigate('plan');break;
 case 'start':start();break;
 case 'pause':{const saved=persist();navigate('home');toast(saved?'已保存当前答题进度。':'当前页面保留进度，但浏览器无法写入存储。');}break;
 case 'prev':if(state.cursor>0){state.cursor--;persist();render();$('#question-title').setAttribute('tabindex','-1');$('#question-title').focus();}break;
 case 'next':if(state.answers[state.cursor]===null){toast('先选择一个答案，再继续。');break;}if(state.cursor===29){complete();}else{state.cursor++;persist();render();$('#question-title').setAttribute('tabindex','-1');$('#question-title').focus();}break;
 case 'retest':state.answers=Array(30).fill(null);state.cursor=0;sampleMode=false;persist();navigate('quiz');break;
 case 'sample':sampleMode=true;navigate('report');break;
 case 'theme':state.theme=state.theme==='light'?'dark':'light';persist();render();break;
 case 'favorite':if(state.favorites.includes(id))state.favorites=state.favorites.filter(v=>v!==id);else state.favorites.push(id);persist();if($('#modal-root').children.length){showDetail(id);}else if(route==='catalog'){renderCatalogCards();}else render();toast(state.favorites.includes(id)?'这个方向已收藏。':'已取消收藏。');break;
 case 'detail':showDetail(id);break;
 case 'filter-category':filters.category=id;render();break;
 case 'reset-filters':filters={query:'',category:'all',time:'all',budget:'all',difficulty:'all',favorites:false};render();break;
 case 'clear-pk':compareIds=[];renderCatalogCards();break;
 case 'compare':if(compareIds.length===2)navigate('compare');break;
 case 'phase':phase=+id;render();break;
 case 'open-report':currentId=id;sampleMode=false;navigate('report');break;
 case 'delete-history':openModal(`<h2>删除这份报告？</h2><p class="subtitle" style="margin:15px 0 22px">对应的计划勾选和备注也会删除。</p><button class="btn danger" data-action="confirm-delete-history" data-id="${esc(id)}">确认删除</button><button class="btn text" data-action="close">取消</button>`);break;
 case 'confirm-delete-history':state.history=state.history.filter(h=>h.id!==id);for(const key of Object.keys(state.plans))if(key.startsWith(id+':'))delete state.plans[key];for(const key of Object.keys(state.edits))if(key.startsWith(id+':'))delete state.edits[key];if(currentId===id)currentId=state.history.at(-1)?.id||null;persist();navigate('history');toast('报告及对应计划记录已删除。');break;
 case 'demo':state.demo=true;persist();closeModal();render();toast('深度演示已开启，不涉及付款。');break;
 case 'demo-off':state.demo=false;persist();render();break;
 case 'commerce':openModal(`<h2>商业接入说明</h2><p class="rec-text">当前为无需后端的HTML演示，没有支付、订单或会员验证，也不具备防破解授权能力。演示开关不代表购买成功。</p><p class="rec-text">上线时需要可信后端创建订单、验证支付回调、绑定用户与权益，并由服务器校验访问权限。前端CONFIG.paymentEndpoint预留订单接口；价格CONFIG.price目前未设置。</p><p class="rec-text">如接入支付，先完成订单与回调验证再展示已购权益，不能仅根据前端开关解锁。</p>`);break;
 case 'poster':await exportPoster();break;
 case 'pdf':if(!getActive()){toast('请先完成测评。');break;}if(!requireDeep())break;route='report';render();closeModal();window.print();break;
 case 'markdown':if(!requireDeep())break;{const c=planContext();if(!c)throw new Error('请先生成报告。');downloadBlob(new Blob(['\uFEFF'+markdownText(c)],{type:'text/markdown;charset=utf-8'}),`30天计划-${c.d.name}.md`);toast('完整30天计划已发起下载。');}break;
 case 'json':if(requireDeep())exportJSON();break;
 case 'friend':navigate('friend');break;
 case 'share-code':if(!$('#share-consent').checked){toast('请先确认你自愿分享八维能力分数。');break;}{const code=encodeFriend(activeResult().profile);$('#share-output').innerHTML=`<textarea id="my-code" class="field wrap" readonly aria-label="我的结果码" style="margin-top:15px">${esc(code)}</textarea><button class="btn text small" data-action="copy-code">复制结果码</button>`;}break;
 case 'copy-code':copyText($('#my-code').value);break;
 case 'import-friend':{const other=decodeFriend($('#friend-code').value.trim()),own=activeResult().profile.scores;const mine=own.map((v,i)=>({i,diff:v-other[i]})).filter(x=>x.i!==7).sort((a,b)=>b.diff-a.diff||a.i-b.i)[0],theirs=own.map((v,i)=>({i,diff:other[i]-v})).filter(x=>x.i!==7).sort((a,b)=>b.diff-a.diff||a.i-b.i)[0];const useful=mine.diff>0&&theirs.diff>0;$('#friend-output').innerHTML=`<div class="friend-chart"><div>${radar(own,other)}<div class="legend"><span><i></i>我的分数</span><span><i class="other"></i>好友分数</span></div></div><div><h3 style="font-size:17px;margin-top:30px">${useful?`你偏强于${DIMENSIONS[mine.i].short}，好友偏强于${DIMENSIONS[theirs.i].short}`:'你们的画像较相近，可以一起小步试做'}</h3><p class="rec-text">${useful?`可尝试分工：你负责${DIMENSIONS[mine.i].short}相关步骤，对方负责${DIMENSIONS[theirs.i].short}相关步骤；先为同一个目标做一个小样，明确责任与时间。`:'相近分数不代表无法合作。可按兴趣和实际经验分工，共同检查交付。'}互补只是分工线索，不能证明合作或赚钱会成功。</p><div class="score-list">${DIMENSIONS.map((d,i)=>`<div class="score-item"><span>${d.short}</span><strong>${own[i]} / ${other[i]}</strong></div>`).join('')}</div></div></div>`;}break;
 case 'about':about();break;
 case 'clear':clearAll();break;
 case 'confirm-clear':try{localStorage.removeItem(CONFIG.storageKey);}catch{throw new Error('浏览器阻止删除存储，请在浏览器设置中清理此站点数据。');}state=emptyState();currentId=null;sampleMode=false;compareIds=[];simConditions=null;phase=0;filters={query:'',category:'all',time:'all',budget:'all',difficulty:'all',favorites:false};storageMessage='';navigate('home');toast('所有本地记录已清空。');break;
 case 'close':closeModal();break;
 }
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){handleAction(b.dataset.action,b.dataset.id).catch(error=>toast(error.message||'操作失败，请重试。'));}else if(e.target.classList.contains('modal-backdrop'))closeModal();});
document.addEventListener('change',e=>{
 const t=e.target;if(t.name==='answer'){state.answers[state.cursor]=+t.value;persist();$$('.option').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));$('[data-action="next"]').disabled=false;}
 if(t.id.startsWith('filter-')){const key={ 'filter-time':'time','filter-budget':'budget','filter-difficulty':'difficulty','filter-fav':'favorites'}[t.id];if(key){filters[key]=t.type==='checkbox'?t.checked:t.value;renderCatalogCards();}}
 if(t.dataset.compare){const id=t.dataset.compare;if(t.checked){if(compareIds.length===2){t.checked=false;toast('一次比较两个方向，请先取消一个。');return;}compareIds.push(id);}else compareIds=compareIds.filter(v=>v!==id);renderCompareTray();}
 if(t.id.startsWith('sim-'))updateSimulation();
 if(t.dataset.day){const c=planContext();if(!c)return;const day=+t.dataset.day,done=new Set(state.plans[c.key]||[]);t.checked?done.add(day):done.delete(day);state.plans[c.key]=[...done].sort((a,b)=>a-b);persist();t.closest('.day-card').classList.toggle('done',t.checked);$('#plan-percent').textContent=`${done.size} / 30 已完成 · ${Math.round(done.size/30*100)}%`;$('#plan-bar').style.width=done.size/30*100+'%';$('#plan-bar').parentElement.setAttribute('aria-valuenow',done.size);}
});
document.addEventListener('input',e=>{if(e.target.id==='search'){filters.query=e.target.value;renderCatalogCards();}if(e.target.dataset.note){const c=planContext();if(c){state.edits[`${c.key}:${e.target.dataset.note}`]=e.target.value.slice(0,500);persist();}}});
document.addEventListener('keydown',e=>{
 const modal=$('.modal');if(modal){if(e.key==='Escape'){e.preventDefault();closeModal();}if(e.key==='Tab'){const focusables=[...modal.querySelectorAll('button:not(:disabled),a[href],input,select,textarea,summary')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}return;}
 if(route==='quiz'&&e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();handleAction('next').catch(error=>toast(error.message));}
});
window.addEventListener('storage',e=>{if(e.key!==CONFIG.storageKey)return;try{state=sanitizeState(e.newValue?JSON.parse(e.newValue):null);currentId=state.history.at(-1)?.id||null;sampleMode=false;if(!e.newValue){compareIds=[];phase=0;route='home';toast('本地数据已在另一个标签页清空。');}render();}catch{storageMessage='另一个标签页的记录无法读取，请刷新或清空本地数据。';updateStorageAlert();}});
window.LabApp={getState:()=>JSON.parse(JSON.stringify(state)),getRoute:()=>route,exportPoster,markdownText,planContext};
render();

</script>
